services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-db:5432/taskmanager
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
    extra_hosts:
      - "postgres-db:host-gateway"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    name: taskmanager-app-network